  </noscript>

  <!-- Font Loading Detector - Cegah FOUT (Flash of Unstyled Text) -->
  <script>
    (function() {
      var isLoaded = false;
      function setLoaded() {
        if (isLoaded) return;
        isLoaded = true;
        document.documentElement.classList.add('icons-loaded');
      }

      if ('fonts' in document) {
        // Tunggu semua stylesheet terurai dan muat font
        document.fonts.ready.then(function() {
          if (document.fonts.check('1em "Material Symbols Rounded"')) {
            setLoaded();
          } else {
            document.fonts.load('1em "Material Symbols Rounded"').then(setLoaded).catch(setLoaded);
          }
        }).catch(setLoaded);

        // Fallback maksimal 2.5 detik agar ikon tetap muncul jika koneksi lambat
        setTimeout(setLoaded, 2500);
      } else {
        setLoaded();
      }
    })();
  </script>

  <!-- ================================================
       LOADING SCREEN — Inline CSS, zero external request
       Spinner ringan menggantikan animasi pulse sebelumnya
       ================================================ -->
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:#dc2626;font-family:'Outfit',system-ui,sans-serif}
    #ls{
      position:fixed;inset:0;background:#dc2626;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      z-index:99999;transition:opacity .4s ease;
    }
    #ls.hidden{opacity:0;pointer-events:none}
    .ls-ring{
      width:80px;height:80px;border-radius:50%;
      border:3px solid rgba(255,255,255,.2);
      border-top-color:#fff;
      animation:lspin .75s linear infinite;
    }
    .ls-logo{
      position:absolute;width:100px;height:100px;
      top:50%;left:50%;transform:translate(-50%,-50%);
      object-fit:contain;
    }
    .ls-wrap{position:relative;width:120px;height:120px;margin-bottom:18px;}
    .ls-text{
      color:rgba(255,255,255,.8);
      font-size:10px;font-weight:600;
      letter-spacing:.14em;text-transform:uppercase;
    }
    @keyframes lspin{to{transform:rotate(360deg)}} .gunungan-loader{animation: gununganPulse 2s infinite ease-in-out;} @keyframes gununganPulse{0%,100%{transform:translate(-50%,-50%) scale(1); opacity:1;} 50%{transform:translate(-50%,-50%) scale(1.15); opacity:0.8;}}
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading screen — muncul sebelum React mount -->
    <div id="ls">
      <div class="ls-wrap">
        <img class="ls-logo gunungan-loader" src="/gunungan_transparent.png" alt="Memuat..." width="100" height="100"
          fetchpriority="high"
          decoding="sync" />
      </div>
      <p class="ls-text">Membuka Gerbang Portal...</p>
    </div>
  </div>

  <!-- Service Worker — register setelah load agar tidak blokir LCP -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
          .then(function(registration) {
            // Cek update setiap 30 detik agar selalu fresh
            setInterval(function() {
              registration.update();
            }, 30 * 1000);

            // Ketika SW baru ditemukan dan siap diinstall
            registration.addEventListener('updatefound', function() {
              var newWorker = registration.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function() {
                // SW baru sudah aktif (installed) → langsung reload halaman
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[SW] Versi baru tersedia, memperbarui...');
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          })
          .catch(function () { /* silent fail */ });

        // Ketika controller SW berubah (SW baru ambil alih) → reload halaman
        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!reloading) {
            reloading = true;
            console.log('[SW] Update tersedia — memuat ulang halaman...');
            window.location.reload();
          }
        });
      });
    }
    // Hook untuk React: sembunyikan loading screen saat app sudah siap
    window.__hideLs = function() {
      var ls = document.getElementById('ls');
      if (!ls) return;
      ls.classList.add('hidden');
      setTimeout(function(){ if(ls.parentNode) ls.parentNode.removeChild(ls); }, 450);
    };
  </script>

  <!-- Vite entry point -->
  <script type="module" src="/src/main.jsx"></script>
</body>
